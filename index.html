<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f5f7f4">
<title>Hoje — Plano Alimentar</title>
<style>
:root{
  --fundo:#f5f7f4;
  --carta:#ffffff;
  --tinta:#10261c;
  --tinta2:#5f6f64;
  --linha:#e1e8e2;
  --verde:#22c55e;
  --verde-fundo:#e9f9ee;
  --verde-escuro:#15803d;
  --ambar:#f59e0b;
  --vermelho:#ef4444;
  --teal:#0d9488;
  --teal-fundo:#e6f6f4;
  --raio:18px;
  --toque:48px;
  --display:ui-rounded,"SF Pro Rounded","Hiragino Maru Gothic ProN",
            "Segoe UI Variable Display",system-ui,-apple-system,sans-serif;
  --corpo:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--fundo);color:var(--tinta);
  font-family:var(--corpo);font-size:17px;line-height:1.4;
  padding-bottom:calc(96px + env(safe-area-inset-bottom));
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit;margin:0;cursor:pointer}
h1,h2,h3,h4,p{margin:0}
.num{font-variant-numeric:tabular-nums;font-family:var(--display)}

/* ---------- cabeçalho ---------- */
.cabecalho{padding:14px 16px 0}
.cabecalho .data{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--tinta2)}
.sessao{display:flex;align-items:center;gap:12px;margin-top:6px}
.sessao .emoji{font-size:40px;line-height:1}
.sessao h1{font-family:var(--display);font-size:27px;line-height:1.1;font-weight:700;letter-spacing:-.02em}
.alvos{margin-top:10px;font-size:15px;color:var(--tinta2)}
.alvos b{font-family:var(--display);color:var(--tinta);font-weight:700}
.aviso-perfil{
  margin-top:10px;background:var(--verde-fundo);color:var(--verde-escuro);
  border:1.5px solid var(--verde);border-radius:12px;padding:8px 8px 8px 12px;
  font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;
  flex-wrap:wrap;justify-content:space-between;
}
.aviso-perfil button{
  min-height:var(--toque);padding:0 16px;border:0;border-radius:12px;
  background:var(--verde-escuro);color:#fff;font-family:var(--display);font-weight:700;font-size:15px;
}

/* ---------- aviso de falha ao salvar ---------- */
/* Falhar em silêncio é o pior defeito possível: ele acha que marcou e não
   marcou. O aviso cobre o topo e só sai com um toque. */
.falha{
  position:sticky;top:0;z-index:60;background:#fef2f2;border-bottom:2px solid var(--vermelho);
  color:#7f1d1d;padding:12px 16px;font-size:14px;display:grid;gap:10px;
}
.falha[hidden]{display:none}
.falha b{color:#7f1d1d}
.falha button{
  min-height:var(--toque);border:0;border-radius:12px;background:var(--vermelho);color:#fff;
  font-family:var(--display);font-weight:700;font-size:16px;padding:0 18px;justify-self:start;
}

/* ---------- navegação entre datas (QUAL DIA) ---------- */
/* Dois controles distintos e de cor distinta: aqui se escolhe a DATA
   (âmbar quando não é hoje); logo abaixo, o CARDÁPIO (verde). */
.datas{padding:14px 16px 0}
.datas-linha{
  display:grid;grid-template-columns:var(--toque) 1fr var(--toque);align-items:center;gap:10px;
  background:var(--carta);border:1.5px solid var(--linha);border-radius:16px;padding:6px;
}
.datas-linha button{
  min-width:var(--toque);min-height:var(--toque);border:0;border-radius:12px;
  background:#eef1ee;color:var(--tinta);font-family:var(--display);font-size:26px;line-height:1;
}
.datas-linha button[disabled]{opacity:.3}
.datas-centro{display:grid;justify-items:center;gap:1px;line-height:1.15}
.datas-dia{font-family:var(--display);font-weight:700;font-size:17px}
.datas-num{font-size:13px;color:var(--tinta2)}
.datas-selo{
  font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  color:var(--tinta2);
}
.datas-selo[data-outra="1"]{color:#92400e}
.datas-aviso{
  margin-top:10px;background:#fef3c7;border:1.5px solid #f59e0b;border-radius:14px;
  padding:10px 12px;font-size:14px;color:#7c4a07;display:grid;gap:8px;
}
.datas-aviso button{
  min-height:var(--toque);border:0;border-radius:12px;background:#92400e;color:#fff;
  font-family:var(--display);font-weight:700;font-size:16px;
}
/* Fora de hoje, uma faixa âmbar acompanha a tela inteira. */
body[data-outra-data="1"] main{border-left:3px solid #f59e0b;border-radius:3px}

/* ---------- abas (Hoje / Semana) ---------- */
.abas{display:flex;gap:8px;padding:14px 16px 0}
.abas button{
  flex:1 1 0;min-height:var(--toque);border:1.5px solid var(--linha);background:var(--carta);
  border-radius:14px;font-family:var(--display);font-weight:700;font-size:16px;color:var(--tinta2);
}
.abas button[aria-selected="true"]{background:var(--tinta);border-color:var(--tinta);color:#fff}

/* ---------- tela Semana ---------- */
#tela-semana{padding:16px 16px 0;display:grid;gap:12px}
.semana-cartao{background:var(--carta);border-radius:var(--raio);border:1px solid var(--linha);padding:16px}
.semana-cartao h2{font-family:var(--display);font-size:19px;font-weight:700;margin-bottom:10px}
.semana-aderencia{font-family:var(--display);font-size:40px;font-weight:700;color:var(--verde-escuro)}
.semana-aderencia span{font-size:16px;color:var(--tinta2);font-weight:600;margin-left:6px}
.semana-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:12px}
.semana-metrica{background:var(--verde-fundo);border-radius:14px;padding:10px;text-align:center}
.semana-metrica .rotulo{display:block;font-size:12px;color:var(--verde-escuro);text-transform:uppercase;letter-spacing:.06em;font-weight:700}
.semana-metrica .valor{font-family:var(--display);font-size:19px;font-weight:700;margin-top:4px}
.semana-metrica .meta{font-size:12px;color:var(--tinta2);display:block;margin-top:2px}
.semana-lista{display:grid;gap:8px;margin-top:4px}
.semana-linha{
  display:flex;justify-content:space-between;align-items:center;padding:10px 12px;
  border:1.5px solid var(--linha);border-radius:12px;font-size:15px;
}
.semana-linha .vezes{font-family:var(--display);font-weight:700;color:#92400e}
.semana-vazio{font-size:14px;color:var(--tinta2)}
.semana-nota{font-size:13px;color:var(--tinta2);margin-top:10px}
.semana-exportar{
  width:100%;min-height:56px;border:0;border-radius:16px;background:var(--verde-escuro);color:#fff;
  font-family:var(--display);font-size:17px;font-weight:700;margin-top:4px;
}

/* ---------- seletor de cardápio (QUAL DIA DA SEMANA) ---------- */
.dias{padding:14px 16px 14px}
.dias-titulo{
  font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--tinta2);
  font-weight:700;margin-bottom:8px;
}
.dias-titulo span{display:block;letter-spacing:0;text-transform:none;font-weight:400;font-size:13px}
.dias-tira{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.dias-tira::-webkit-scrollbar{display:none}
.dias-tira button{
  flex:0 0 auto;min-width:var(--toque);min-height:var(--toque);
  border:1.5px solid var(--linha);background:var(--carta);border-radius:14px;
  padding:0 14px;font-family:var(--display);font-weight:700;font-size:15px;
  color:var(--tinta2);
}
.dias-tira button[aria-pressed="true"]{background:var(--verde-escuro);border-color:var(--verde-escuro);color:#fff}
.dias-tira button[data-calendario="1"]{box-shadow:inset 0 -3px 0 var(--verde)}

/* ---------- barras pegajosas ---------- */
.barras{
  position:sticky;top:0;z-index:20;
  background:color-mix(in srgb,var(--fundo) 88%,transparent);
  backdrop-filter:saturate(160%) blur(12px);
  -webkit-backdrop-filter:saturate(160%) blur(12px);
  border-bottom:1px solid var(--linha);
  padding:10px 16px 12px;display:grid;gap:10px;
}
.barra{display:grid;grid-template-columns:1fr auto;gap:2px 10px;align-items:baseline}
.barra .rotulo{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--tinta2);font-weight:700}
/* Sinal não-cromático: texto curto redundante com a cor, do mesmo jeito que
   as refeições já traziam "· completa". Quem não separa verde de amarelo lê. */
.selo-status{
  margin-left:7px;letter-spacing:.02em;text-transform:none;font-size:12px;font-weight:700;
  padding:1px 7px;border-radius:999px;background:#eef1ee;color:var(--tinta2);
}
.selo-status[data-status="verde"]{background:var(--verde-fundo);color:var(--verde-escuro)}
.selo-status[data-status="amarelo"]{background:#fef3c7;color:#92400e}
.selo-status[data-status="vermelho"]{background:#fee2e2;color:#991b1b}
.barra .valor{font-family:var(--display);font-size:19px;font-weight:700;font-variant-numeric:tabular-nums}
.barra .valor .meta{font-size:14px;font-weight:600;color:var(--tinta2)}
/* trilho: 0–125% da meta. A marca da meta fica a 80% da largura, então
   passar da meta é visível e continua verde — nunca vira alerta. */
.trilho{
  grid-column:1/-1;position:relative;height:12px;border-radius:999px;
  background:#e7ece7;overflow:hidden;
}
.trilho .excedente{position:absolute;inset:0 0 0 80%;background:repeating-linear-gradient(135deg,#dfe6e0 0 3px,#e7ece7 3px 6px)}
.trilho .cheio{position:absolute;inset:0 auto 0 0;border-radius:999px;transition:width .35s cubic-bezier(.3,1,.4,1)}
.trilho .cheio[data-status="verde"]{background:var(--verde)}
.trilho .cheio[data-status="amarelo"]{
  background:repeating-linear-gradient(135deg,var(--ambar) 0 5px,#d98706 5px 10px);
}
.trilho .cheio[data-status="vermelho"]{
  background:repeating-linear-gradient(135deg,var(--vermelho) 0 3px,#c42b2b 3px 6px);
}
.trilho .marca{position:absolute;left:80%;top:-2px;bottom:-2px;width:2px;background:var(--tinta);opacity:.55}
.legenda-meta{font-size:11px;color:var(--tinta2);text-align:right;margin-top:-4px}

/* ---------- refeições ---------- */
main{padding:16px 16px 0;display:grid;gap:12px}
.refeicao{background:var(--carta);border-radius:var(--raio);border:1px solid var(--linha);overflow:hidden}
.refeicao[data-estado="completa"]{border-color:var(--verde);box-shadow:0 0 0 1px var(--verde)}
.cabeca{
  width:100%;min-height:64px;display:grid;
  grid-template-columns:62px 1fr 22px;align-items:center;gap:10px;
  background:none;border:0;padding:12px 14px;text-align:left;
}
.cabeca .hora{font-family:var(--display);font-weight:700;font-size:15px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.cabeca .nome{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.01em}
.cabeca .sub{grid-column:2;font-size:14px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.cabeca .sub[data-estado="completa"]{color:var(--verde-escuro);font-weight:650}
.seta{justify-self:end;color:var(--tinta2);transition:transform .2s}
.cabeca[aria-expanded="true"] .seta{transform:rotate(90deg)}
.ponto{display:inline-block;width:9px;height:9px;border-radius:999px;margin-right:7px;vertical-align:1px;background:#cfd8d1}
.ponto[data-estado="parcial"]{background:var(--ambar)}
.ponto[data-estado="completa"]{background:var(--verde)}
.tag{
  display:inline-block;margin-left:8px;font-family:var(--corpo);font-size:12px;font-weight:700;
  letter-spacing:.04em;padding:3px 8px;border-radius:999px;background:#eef1ee;color:var(--tinta2);
  vertical-align:2px;
}
.tag[data-tipo="obrigatorio"]{background:#fef3c7;color:#92400e}

.corpo{padding:0 14px 14px;border-top:1px solid var(--linha)}
.resumo{
  margin:12px 0;font-family:var(--display);font-weight:700;font-size:15px;
  color:var(--verde-escuro);background:var(--verde-fundo);border-radius:12px;padding:10px 12px;
}
.nota{margin:12px 0 0;font-size:13px;color:var(--tinta2)}
.opcao{margin-top:14px}
.opcao h4{
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  font-family:var(--display);font-size:13px;font-weight:700;letter-spacing:.08em;
  text-transform:uppercase;color:var(--tinta2);margin-bottom:8px;
}
.opcao .letra{
  display:grid;place-items:center;width:24px;height:24px;border-radius:8px;
  background:#eef1ee;color:var(--tinta);font-size:14px;letter-spacing:0;
}
.melhor{background:var(--verde);color:#fff;border-radius:999px;padding:3px 9px;letter-spacing:.04em;font-size:11px}
.itens{display:grid;gap:7px}
.ing{
  width:100%;min-height:var(--toque);display:flex;align-items:center;gap:10px;
  padding:10px 14px;border-radius:14px;border:1.5px solid var(--linha);
  background:var(--carta);text-align:left;transition:background .12s,color .12s,border-color .12s;
}
.ing .caixa{
  flex:0 0 auto;width:20px;height:20px;border-radius:7px;border:2px solid #c8d2cb;
  display:grid;place-items:center;font-size:13px;color:transparent;
}
.ing .texto{flex:1 1 auto;font-size:16px}
.ing .g{font-size:13px;color:var(--tinta2);font-variant-numeric:tabular-nums}
.ing[aria-pressed="true"]{background:var(--verde);border-color:var(--verde);color:#fff;font-weight:650}
.ing[aria-pressed="true"] .caixa{background:#fff;border-color:#fff;color:var(--verde)}
.ing[aria-pressed="true"] .g{color:rgba(255,255,255,.82)}
.ing:active{transform:scale(.99)}
.bruto{font-size:15px;color:var(--tinta2);padding:8px 2px}

/* ---------- combustível ---------- */
.combustivel{background:var(--carta);border-radius:var(--raio);border:1px solid var(--linha);overflow:hidden}
.combustivel[data-destaque="1"]{border-color:var(--teal);box-shadow:0 0 0 1px var(--teal);background:var(--teal-fundo)}
.combustivel .cabeca .nome{color:var(--teal)}
.comb-sub{font-size:13px;color:var(--tinta2);margin:10px 0 12px}
.doses{display:grid;gap:8px}
/* A linha é um par de alvos: o corpo soma (+), o botão separado desfaz (−).
   Ambos com 48 px de lado — um toque a mais às 5h da manhã tem volta. */
.dose{display:flex;gap:8px;align-items:stretch}
.dose-mais{
  flex:1 1 auto;min-height:60px;display:grid;grid-template-columns:1fr auto auto;
  align-items:center;gap:12px;padding:10px 14px;border-radius:14px;
  border:1.5px solid var(--linha);background:var(--carta);text-align:left;
}
.dose-mais.solo{width:100%}
.nome-dose{font-family:var(--display);font-weight:700;font-size:17px}
.sublabel{font-size:13px;color:var(--tinta2)}
.qtd{
  font-family:var(--display);font-weight:700;font-size:17px;font-variant-numeric:tabular-nums;
  min-width:var(--toque);min-height:var(--toque);display:grid;place-items:center;border-radius:12px;
  background:#eef1ee;color:var(--tinta2);
}
.mais{
  min-width:var(--toque);min-height:var(--toque);display:grid;place-items:center;border-radius:12px;
  background:var(--teal);color:#fff;font-size:24px;font-family:var(--display);
}
.dose[data-cor="teal"] .qtd[data-ativo="1"]{background:var(--teal);color:#fff}
.dose[data-cor="tinta"] .qtd[data-ativo="1"]{background:var(--tinta);color:#fff}
.dose[data-cor="tinta"] .mais{background:var(--tinta)}
.dose-mais.solo .qtd[data-ativo="1"]{background:var(--teal);color:#fff}
.contador-menos{
  flex:0 0 auto;min-width:var(--toque);min-height:var(--toque);
  border:1.5px solid var(--linha);border-radius:14px;background:var(--carta);
  font-family:var(--display);font-size:26px;line-height:1;color:var(--tinta);
}

/* ---------- extras ---------- */
.extras{background:var(--carta);border-radius:var(--raio);border:1px dashed var(--linha);padding:14px}
.extras h3{font-family:var(--display);font-size:17px;font-weight:700;margin-bottom:8px}
.extras .vazio{font-size:14px;color:var(--tinta2)}

.rodape{
  position:fixed;left:0;right:0;bottom:0;z-index:30;
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  background:color-mix(in srgb,var(--fundo) 90%,transparent);
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-top:1px solid var(--linha);
}
.rodape button{
  width:100%;min-height:56px;border:0;border-radius:16px;background:var(--tinta);color:#fff;
  font-family:var(--display);font-size:18px;font-weight:700;
}

/* ---------- folha de extras ---------- */
.folha{position:fixed;inset:0;z-index:40;display:none}
.folha[data-aberta="1"]{display:block}
.folha .veu{position:absolute;inset:0;background:rgba(16,38,28,.38)}
.folha .painel{
  position:absolute;left:0;right:0;bottom:0;max-height:82vh;overflow-y:auto;
  background:var(--fundo);border-radius:22px 22px 0 0;
  padding:18px 16px calc(18px + env(safe-area-inset-bottom));
  animation:sobe .22s cubic-bezier(.3,1,.4,1);
}
@keyframes sobe{from{transform:translateY(18px)}to{transform:none}}
.folha h2{font-family:var(--display);font-size:21px;font-weight:700;margin-bottom:4px}
.folha .dica{font-size:14px;color:var(--tinta2);margin-bottom:14px}
.folha .lista{display:grid;gap:8px}
.folha .fechar{width:100%;min-height:56px;margin-top:14px;border:0;border-radius:16px;background:var(--tinta);color:#fff;font-family:var(--display);font-size:18px;font-weight:700}

:focus-visible{outline:3px solid var(--verde-escuro);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
  <div class="falha" id="falha" role="alert" hidden></div>
  <nav class="abas" id="abas" aria-label="Tela"></nav>
  <div id="tela-hoje">
    <nav class="datas" id="datas" aria-label="Data que está sendo registrada"></nav>
    <header class="cabecalho" id="cabecalho"></header>
    <nav class="dias" id="dias" aria-label="Cardápio usado nesta data"></nav>
    <div class="barras" id="barras" aria-live="polite"></div>
    <main id="refeicoes"></main>
  </div>
  <main id="tela-semana" hidden></main>
  <div class="rodape" id="rodape"><button type="button" data-acao="abrir-extras">+ Extra</button></div>
  <div class="folha" id="folha" data-aberta="0">
    <div class="veu" data-acao="fechar-extras"></div>
    <div class="painel" role="dialog" aria-modal="true" aria-label="Adicionar extra">
      <h2>Extra</h2>
      <p class="dica">Um toque adiciona ao dia. O que você mais usa fica no topo.</p>
      <div class="lista" id="lista-extras"></div>
      <button type="button" class="fechar" data-acao="fechar-extras">Pronto</button>
    </div>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
